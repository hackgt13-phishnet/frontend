<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Instagram</title>
  <link rel="stylesheet" href="./sass/phone-app.css">
</head>
<body class="phone-body">
  <div class="phone-stage">
    <div class="phone-shell">
      <div class="phone-notch" aria-hidden="true"></div>
      <div class="phone-status">
        <span>1:37</span>
        <span class="sys">▮▮▮ · Wi‑Fi · 🔋</span>
      </div>

      <div class="app-screen">
        <header class="m-header">
          <button class="m-icon-btn" type="button" title="Create">
            <img src="./images/tab.svg" alt="">
          </button>
          <a class="m-brand" href="./index.html">
            <img class="wordmark" src="./images/logo_menu.png" alt="Instagram">
            <img class="chev" src="./images/chevron-sm.svg" alt="">
          </a>
          <button class="m-icon-btn" type="button" title="Notifications">
            <img src="./images/love.svg" alt="">
          </button>
        </header>

        <div class="app-scroll">
          <div class="m-stories">
            <div class="m-story yours">
              <div class="ring">
                <div class="ring-inner">
                  <img src="https://i.pravatar.cc/150?img=8" alt="">
                </div>
                <span class="add">+</span>
              </div>
              <div class="name">Your story</div>
            </div>
            <div class="m-story">
              <div class="ring"><div class="ring-inner"><img src="https://i.pravatar.cc/150?img=12" alt=""></div></div>
              <div class="name">alvinkuai</div>
            </div>
            <div class="m-story">
              <div class="ring"><div class="ring-inner"><img src="https://i.pravatar.cc/150?img=33" alt=""></div></div>
              <div class="name">_aaravnagpal</div>
            </div>
            <div class="m-story">
              <div class="ring"><div class="ring-inner"><img src="https://i.pravatar.cc/150?img=47" alt=""></div></div>
              <div class="name">georgia.inst</div>
            </div>
            <div class="m-story">
              <div class="ring"><div class="ring-inner"><img src="https://i.pravatar.cc/150?img=20" alt=""></div></div>
              <div class="name">roshan_ram</div>
            </div>
            <div class="m-story">
              <div class="ring"><div class="ring-inner"><img src="https://i.pravatar.cc/150?img=52" alt=""></div></div>
              <div class="name">veer.dabbi</div>
            </div>
          </div>

          <article class="m-post">
            <div class="m-post-head">
              <img class="av" src="https://i.pravatar.cc/150?img=59" alt="">
              <div class="who">
                <div class="user">rap <span class="badge">✓</span></div>
                <div class="audio">♪ Petit Biscuit · Sunset Lover</div>
              </div>
              <button class="more" type="button"><img src="./images/menu.svg" alt=""></button>
            </div>
            <div class="m-post-media">
              <img src="https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=900&h=1125&fit=crop" alt="">
              <div class="overlay-text">
                <span>NEW YORK CITY</span><br>
                <span>JUST HAD ONE OF THE</span><br>
                <span>CRAZIEST SUNSETS</span><br>
                <span>OF THE YEAR !! 🔥</span>
              </div>
            </div>
            <div class="m-post-actions">
              <button class="act" type="button"><img src="./images/heart.svg" alt=""> 92.6K</button>
              <button class="act" type="button"><img src="./images/comment.svg" alt=""> 1,482</button>
              <button class="act" type="button"><img src="./images/share.svg" alt=""> 2,105</button>
              <span class="spacer"></span>
              <button class="act" type="button"><img src="./images/bookmark.svg" alt=""> 6,851</button>
            </div>
            <div class="m-post-caption">
              <strong>rap</strong> golden hour hits different in the city 🌇
            </div>
          </article>

          <article class="m-post">
            <div class="m-post-head">
              <img class="av" src="https://i.pravatar.cc/150?img=12" alt="">
              <div class="who">
                <div class="user">alvinkuai</div>
                <div class="audio">Original audio</div>
              </div>
              <button class="more" type="button"><img src="./images/menu.svg" alt=""></button>
            </div>
            <div class="m-post-media">
              <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900&h=1125&fit=crop" alt="">
            </div>
            <div class="m-post-actions">
              <button class="act" type="button"><img src="./images/heart.svg" alt=""> 4,210</button>
              <button class="act" type="button"><img src="./images/comment.svg" alt=""> 88</button>
              <button class="act" type="button"><img src="./images/share.svg" alt=""> 41</button>
              <span class="spacer"></span>
              <button class="act" type="button"><img src="./images/bookmark.svg" alt=""></button>
            </div>
            <div class="m-post-caption">
              <strong>alvinkuai</strong> weekend reset
            </div>
          </article>
        </div>

        <nav class="m-tabbar" aria-label="Primary">
          <a href="./index.html" class="active" title="Home">
            <img src="./images/home-filled.svg" alt="Home">
          </a>
          <a href="./reels.html" title="Reels">
            <img src="./images/video.svg" alt="Reels">
          </a>
          <a href="./messages.html" title="Messages">
            <img src="./images/send.svg" alt="Messages">
            <span class="dot"></span>
          </a>
          <a href="#" title="Search">
            <img src="./images/search.svg" alt="Search">
          </a>
          <a href="./profile.html" title="Profile">
            <img class="av" src="https://i.pravatar.cc/150?img=8" alt="Profile">
            <span class="dot"></span>
          </a>
        </nav>
      </div>
    </div>
  </div>
</body>
</html>
